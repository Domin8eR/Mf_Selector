# Alembic configuration file.
# The database URL is overridden in alembic/env.py using app settings —
# the sqlalchemy.url line here is a fallback placeholder only.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Overridden in env.py from app.core.config settings
sqlalchemy.url = postgresql://mfit:mfit_dev@localhost:5432/mfit

[post_write_hooks]
# Uncomment to auto-format generated migration files:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
