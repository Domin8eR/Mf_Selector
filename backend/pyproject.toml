[project]
name = "altstreet-backend"
version = "0.1.0"
description = "AltStreet — client-rule-based mutual fund research workspace"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    # Pydantic v2 + settings
    "pydantic==2.7.1",
    "pydantic-settings==2.3.0",
    "email-validator==2.1.1",
    # Database
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    # Caching / queue
    "redis==5.0.6",
    "celery==5.3.6",
    "celery[redis]==5.3.6",
    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    # Object storage
    "boto3==1.34.131",
    # Logging / observability
    "structlog==24.2.0",
    "sentry-sdk[fastapi]==2.5.1",
    # HTTP client (used by tests and AI layer)
    "httpx==0.27.0",
    # Env loading
    "python-dotenv==1.0.1",
    "anthropic==0.34.2",
    "python-dateutil==2.9.0",
    # Quant
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scipy==1.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "ruff==0.4.8",
    "black==24.4.2",
]

[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
